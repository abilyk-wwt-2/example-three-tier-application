name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in src/api/*.js; do node --check "$f"; done

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every PR must add an entry to CHANGELOG.md
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md; then
            echo "::error::CHANGELOG.md was not changed. Add a line describing this PR to CHANGELOG.md."
            exit 1
          fi
